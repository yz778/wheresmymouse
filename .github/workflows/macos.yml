name: macOS build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression tests
        run: bash scripts/test.sh
      - name: Build and verify the universal ZIP
        id: package
        shell: bash
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match v$version from Resources/Info.plist"
            exit 1
          fi
          ./scripts/release.sh --current
          archive="build/wheresmymouse-$version-macos-universal.zip"

          unpacked=$(mktemp -d "$RUNNER_TEMP/wheresmymouse.XXXXXX")
          trap 'rm -rf -- "$unpacked"' EXIT
          ditto -x -k "$archive" "$unpacked"
          app="$unpacked/wheresmymouse.app"
          archs=$(xcrun lipo -archs "$app/Contents/MacOS/wheresmymouse")
          case "$archs" in
            'arm64 x86_64'|'x86_64 arm64') ;;
            *) echo "::error::Expected arm64 and x86_64, got: $archs"; exit 1 ;;
          esac
          codesign --verify --strict "$app"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "wheresmymouse-$version-macos-universal.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Where's My Mouse $version"
